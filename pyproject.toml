[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysommer"
version = "0.2.3"
description = "Python translation of core computational routines from sommer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
]

[project.optional-dependencies]
sklearn = [
  "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "pytest>=7.0",
  "scikit-learn>=1.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pysommer*"]
