[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pysommer"
version = "0.3.0"
description = "Mixed Model Equations Solver using the C++ core of the R sommer package with a Python interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
]

[project.optional-dependencies]
sklearn = [
  "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "pytest>=7.0",
  "scikit-learn>=1.3",
]

[tool.scikit-build]
wheel.packages = ["pysommer"]
build-dir = "build/{wheel_tag}"
